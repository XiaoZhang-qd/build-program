name: Build DylibLoader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcodebuild -version

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang \
            -arch arm64 \
            -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -o DylibLoader.dylib \
            src/DylibLoader.m \
            -framework Foundation \
            -framework UIKit \
            -install_name @rpath/DylibLoader.dylib

      - name: Inspect
        run: |
          file DylibLoader.dylib
          lipo -info DylibLoader.dylib
          otool -L DylibLoader.dylib

      - name: Package
        run: |
          mkdir -p artifact
          cp DylibLoader.dylib artifact/
          cp README.md artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DylibLoader-arm64
          path: artifact/

name: Build C‑GUI iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git make curl tar xz-utils dpkg-dev libxml2-utils

      - name: Clone and install Theos
        shell: bash
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # Upstream Theos installer scripts may not have the executable bit.
          # Invoke them explicitly through bash so GitHub Actions does not fail with exit 126.
          bash "$THEOS/bin/install-theos"
          bash "$THEOS/bin/install-sdk" latest

      - name: Compile C code to IPA
        shell: bash
        run: |
          set -e
          export THEOS="${{ env.THEOS }}"
          make clean
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: C‑GUI‑ipa
          path: packages/*.ipa
          retention-days: 30
